# Disposable integration/E2E test stack (isolated project/volumes, no user data touched)
# Usage: docker compose -p komik_mirror_test -f docker-compose.test.yml up -d

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: komik_mirror_test
      MYSQL_ROOT_PASSWORD: test_root_password_only
      MYSQL_MIGRATOR_USER: komik_migrator
      MYSQL_MIGRATOR_PASSWORD: test_migrator_password_only
      MYSQL_APP_USER: komik_app
      MYSQL_APP_PASSWORD: test_app_password_only
    volumes:
      - test_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_APP_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_APP_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  test_mysql_data:
