services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-komik_mirror}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-komik_migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-komik_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_APP_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_APP_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_APP_USER:-komik_app}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-komik_mirror}
      MIGRATION_DATABASE_URL: mysql://${MYSQL_MIGRATOR_USER:-komik_migrator}:${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-komik_mirror}
    networks:
      - db_net

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_APP_USER:-komik_app}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-komik_mirror}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_SIGNIN_RATE_LIMIT_WINDOW: ${AUTH_SIGNIN_RATE_LIMIT_WINDOW:-60}
      AUTH_SIGNIN_RATE_LIMIT_MAX: ${AUTH_SIGNIN_RATE_LIMIT_MAX:-10}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Komik Mirror <no-reply@komik-mirror.local>}
      SHINIGAMI_REMOTE_PANELS_ENABLED: ${SHINIGAMI_REMOTE_PANELS_ENABLED:-true}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      SYNC_LATEST_PAGES: ${SYNC_LATEST_PAGES:-2}
      SYNC_REQUEST_DELAY_MS: ${SYNC_REQUEST_DELAY_MS:-350}
      SYNC_CHAPTERS_PER_SERIES: ${SYNC_CHAPTERS_PER_SERIES:-100}
      SYNC_MAX_SERIES_CHAPTER_FETCH: ${SYNC_MAX_SERIES_CHAPTER_FETCH:-40}
      MEDIA_ROOT: /var/lib/komik-mirror/media
    volumes:
      - media_data:/var/lib/komik-mirror/media
    networks:
      - db_net
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sync:
    build:
      context: .
      target: migrator
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/sync-shinigami.ts", "--watch"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_APP_USER:-komik_app}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-komik_mirror}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      SYNC_LATEST_PAGES: ${SYNC_LATEST_PAGES:-2}
      SYNC_REQUEST_DELAY_MS: ${SYNC_REQUEST_DELAY_MS:-350}
      SYNC_CHAPTERS_PER_SERIES: ${SYNC_CHAPTERS_PER_SERIES:-100}
      SYNC_MAX_SERIES_CHAPTER_FETCH: ${SYNC_MAX_SERIES_CHAPTER_FETCH:-40}
    networks:
      - db_net
      - app_net

  import:
    profiles: ["tools"]
    build:
      context: .
      target: importer
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql://${MYSQL_APP_USER:-komik_app}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-komik_mirror}
      MEDIA_ROOT: /var/lib/komik-mirror/media
      SNAPSHOT_DIR: /snapshot
    volumes:
      - ./data:/snapshot:ro
      - media_data:/var/lib/komik-mirror/media
    networks:
      - db_net

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app_net

networks:
  db_net:
    driver: bridge
    internal: true
  app_net:
    driver: bridge

volumes:
  mysql_data:
  media_data:
